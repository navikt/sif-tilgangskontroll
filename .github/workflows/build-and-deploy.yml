# This workflow trigger on push to any branch.
name: Build
on:
  push:
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
      - 'CODEOWNERS'
    branches:

jobs:
#  sonar:
#    uses: navikt/sif-gha-workflows/.github/workflows/gradle-sonar.yml@main
#    permissions:
#      contents: read
#      pull-requests: read
#    secrets: inherit
#    with:
#      readertoken: false

  test:
    uses: navikt/sif-gha-workflows/.github/workflows/gradle-test.yml@main
    permissions:
      contents: read
    secrets: inherit
    with:
      readertoken: false
      buildcommand: './gradlew check'
      javaversion: 25

  codeql:
    uses: navikt/sif-gha-workflows/.github/workflows/gradle-codeql.yml@main
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    secrets: inherit
    with:
      readertoken: false
      package-command: './gradlew clean build -x test'
      branch: master
      javaversion: 25
